kernel_id: "Histogram-Inline"
group: "reduction"
difficulty: 2

tasks:
  - "Multi-PE histogram with inline northward reduction. Each PE bins its
     local input elements into histogram buckets, then sends partial
     histograms north via explicit fabric. PE(0,0) accumulates the final
     result. No tally module — the reduction protocol is fully visible."

task_class: "real-translation"
split: "test"

inputs:
  - {name: "input", shape: "[N_TOTAL]", dtype: "u32",
     description: "input values to bin (distributed across Py PEs)"}

outputs:
  - {name: "hist", shape: "[n_buckets]", dtype: "u32",
     tolerance_abs: 0, tolerance_rel: 0,
     description: "histogram bin counts (exact integer match)"}

sizes:
  - name: small
    role: correctness
    params: {Py: 4, n_per_pe: 64, n_buckets: 16, bucket_size: 64}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: null, time_send_us: null}

metric:
  class: cycles
  reason: "agent-written inline binning + fabric reduction; no tally library"

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — assert_array_equal(hist_device, hist_ref) + SUCCESS"

eval:
  train_seed: 42
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

hidden_from_optimize_only:
  - "CSL/pe.csl"

tags:
  - "multi_pe"
  - "histogram"
  - "fabric_reduction"
  - "hand_written"
  - "no_tally"
