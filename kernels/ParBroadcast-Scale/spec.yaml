kernel_id: "ParBroadcast-Scale"
group: "collective"
difficulty: 2

tasks:
  - "Broadcast + elementwise scale across a 4-PE strip. PE0 broadcasts
     alpha east via wavelets (fan-out routing); each PE then computes
     out[i] = alpha * x[i] on its local chunk. entrypoint = compute."

inputs:
  - {name: "x", shape: "[n_per_pe * width]", dtype: "f32"}
  - {name: "alpha", shape: "[1]", dtype: "f32"}

outputs:
  - {name: "out", shape: "[n_per_pe * width]", dtype: "f32",
     tolerance_abs: 1.0e-6, tolerance_rel: 1.0e-5,
     description: "out == alpha * x; verified in run.py + SUCCESS"}

sizes:
  - name: small
    role: correctness
    params: {n_per_pe: 128, width: 4, height: 1}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 2322}

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "broadcast collective + elementwise multiply; exercises fan-out routing"

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — np.testing.assert_allclose + SUCCESS"
hidden_from_optimize_only: ["CSL/pe.csl"]
tags: ["multi_pe", "collective", "broadcast", "elementwise", "difficulty_2"]
