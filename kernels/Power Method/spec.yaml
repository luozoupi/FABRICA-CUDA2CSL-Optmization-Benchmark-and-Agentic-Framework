# xkernel-bench spec — see kernels/SPEC_SCHEMA.md for format.
kernel_id: "Power-Method"
group: "linalg"
difficulty: 2

tasks:
  - "Power-method iteration for largest eigenvalue/eigenvector of a row-distributed
     sparse matrix A. Repeatedly compute x_{k+1} = A * x_k / ||A * x_k||_2 until
     convergence (or fixed iteration count)."
  - "Inner SpMV (A * x) requires the same row-reduce pattern as the 7-point stencil:
     each PE computes a local partial product and reduces along the row dimension."
  - "Inner L2 norm requires a global reduce across all PEs."

inputs:
  - {name: "A_coeffs", shape: "[width, height, k, 7]", dtype: "f32",
     description: "sparse matrix coefficients in 7-point stencil pattern"}
  - {name: "x0",       shape: "[width, height, k]",     dtype: "f32",
     description: "initial eigenvector estimate"}

outputs:
  - {name: "x_final", shape: "[width, height, k]", dtype: "f32",
     tolerance_abs: 0.0, tolerance_rel: 0.0,
     description: "eigenvector after fixed iterations; reference verifies element-by-element"}
  - {name: "lambda",  shape: "[1]", dtype: "f32",
     description: "dominant eigenvalue estimate"}

# Re-baselined 2026-06-18 (Workstream A). The bench now builds the on-device
# variant (layout_power.csl -> kernel_power.csl); the timed f_tic..f_toc window
# brackets a single on-device f_power(zDim, max_ite) call instead of a host-side
# loop of 3 blocking RPCs/iter. cycles_send now scales ~linearly with max_ite
# (~4350 cyc/iter) and reflects on-device compute, so W2 edits to the (now
# actually-compiled) kernel_power.csl can move it. The old 4877 was measured
# under the host-loop instrumentation at max_ite=1 and is not comparable to the
# current contract (max_ite=10). Measured fresh: 43436 cycles, SUCCESS.
wse3_reference:
  cycles_send: 43436
  time_send_us: 51.1012
  upstream_source: "csl-examples/benchmarks/power-method (device_run.py on-device variant)"
  params: {width: 5, height: 5, MAX_ZDIM: 5, BLOCK_SIZE: 2, m: 5, n: 5, k: 5, max_ite: 10}
  prev_baseline: {cycles_send: 4877, note: "host-loop instrumentation, max_ite=1, not comparable"}

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — asserts numerical match against host reference"

hidden_from_optimize_only:
  - "CSL/src/kernel.csl"
  - "CSL/src/kernel_power.csl"
  - "CSL/src/blas.csl"

# Per-kernel optimizer angle whitelist. Power-Method is an iterative SpMV +
# norm + scale loop. Generic angles produced 0% improvement in Track A;
# steering to BLAS-shaped levers should plausibly help.
#
# Why these (linalg + iterative):
#  - fmac_bulk: every SpMV + axpy + dot-product is FMA-heavy.
#  - dsd_offset_chaining: vector ops walk strided memory.
#  - async_detach_overlap: norm reduce can overlap with next SpMV setup.
#  - task_chaining_unblock_activate: the iterate-norm-scale cycle is a
#    pipeline; .activate/.unblock decouples stages.
#  - comptime_cleanup + comptime_hoist: tile sizes are comptime params.
#  - prefetch_fabric_async: row-reduce receives are on the hot path.
optimization_angles:
  - "iterative_phase_fusion"  # 9 host launches/iter — high-leverage if any can be fused
  - "comptime_value_tuning"   # imported allreduce/blas modules accept comptime structs
  - "fmac_bulk"
  - "dsd_offset_chaining"
  - "async_detach_overlap"
  - "task_chaining_unblock_activate"
  - "comptime_cleanup"
  - "comptime_hoist"
  - "prefetch_fabric_async"

# `attempted_no_op_angles` — angles tried on this kernel that produced no
# cycle reduction (Sonnet returned identical code or rejected variant).
# Selector deprioritizes (✗ markers) but doesn't hard-skip — if base code
# changes materially, the angle might be worth a retry.
attempted_no_op_angles:
  - {angle: "comptime_value_tuning", runs_tried: 1, last_attempted: "run_20260602_220045 (Sonnet returned identical code; BLOCK_SIZE=MAX_ZDIM doesn't apply: PM's bottleneck is the iterative outer loop, not the SpMV chunking)"}
  - {angle: "fmac_bulk", runs_tried: 1, last_attempted: "run_20260602_220045 (no reduction; reference already uses bulk DSDs)"}
  - {angle: "dsd_offset_chaining", runs_tried: 2, last_attempted: "run_20260602_220045 (no reduction; reference has no DSD-rebuild-in-loop pattern)"}
  - {angle: "comptime_hoist", runs_tried: 1, last_attempted: "run_20260602_220045 (no reduction)"}

tags:
  - "iterative"
  - "global_reduce"
  - "fabric_row_reduce"
  - "eigensolver"
