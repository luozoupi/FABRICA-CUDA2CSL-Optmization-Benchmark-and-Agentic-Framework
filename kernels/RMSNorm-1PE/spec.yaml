kernel_id: "RMSNorm-1PE"
group: "normalization"
difficulty: 2

tasks:
  - "Apply RMS normalization with learnable weight on a single PE:
     rms = sqrt(mean(x^2) + eps), out[i] = (x[i]/rms) * weight[i].
     Two-pass: reduce for rms, then elementwise scale. entrypoint = compute."

inputs:
  - {name: "x", shape: "[n]", dtype: "f32"}
  - {name: "weight", shape: "[n]", dtype: "f32"}

outputs:
  - {name: "out", shape: "[n]", dtype: "f32",
     tolerance_abs: 1.0e-5, tolerance_rel: 1.0e-4,
     description: "out == (x/rms)*weight; verified in run.py (assert_allclose) + SUCCESS"}

sizes:
  - name: small
    role: correctness
    params: {n: 256}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 10947}

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "two-pass: sum-of-squares reduction + sqrt + elementwise mul/div; on-device TSC window"

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — np.testing.assert_allclose + SUCCESS"

hidden_from_optimize_only:
  - "CSL/pe.csl"

tags:
  - "single_pe"
  - "normalization"
  - "reduction"
  - "llm"
  - "kernelbench_enrichment"
