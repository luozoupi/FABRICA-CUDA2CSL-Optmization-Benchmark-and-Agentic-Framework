kernel_id: "Softmax-1PE"
group: "activation"
difficulty: 3

tasks:
  - "Compute numerically stable softmax on a single PE:
     m=max(x), out[i]=exp(x[i]-m)/sum(exp(x[j]-m)).
     Three-pass: max-find, exp+sum, normalize. entrypoint = compute."

inputs:
  - {name: "x", shape: "[n]", dtype: "f32"}

outputs:
  - {name: "out", shape: "[n]", dtype: "f32",
     tolerance_abs: 1.0e-6, tolerance_rel: 1.0e-4,
     description: "out == stable_softmax(x); verified in run.py + SUCCESS"}

sizes:
  - name: small
    role: correctness
    params: {n: 256}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 35681}

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "three-pass: max-reduce + exp+sum + normalize; exercises CSL math library; on-device TSC"

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — np.testing.assert_allclose + SUCCESS"
hidden_from_optimize_only: ["CSL/pe.csl"]
tags: ["single_pe", "activation", "reduction", "transcendental", "transformer", "kernelbench_enrichment"]
