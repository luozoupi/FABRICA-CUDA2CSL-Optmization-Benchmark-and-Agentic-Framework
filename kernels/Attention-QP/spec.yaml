kernel_id: "Attention-QP"
group: "attention"
difficulty: 4

tasks:
  - "Dense scaled-dot-product attention O = softmax(Q K^T / sqrt(d)) V for one
     head over S query rows, query-parallel on a P x P PE grid: each PE owns
     St_q = S/(P*P) query rows, K and V are replicated to every PE, softmax is
     local. entrypoint = compute (frozen: enables the TSC, stamps start, calls
     attention(), stamps finish, unblocks). The agent edits attention()."

inputs:
  - {name: "Q", shape: "[S * d]", dtype: "f32", description: "row-major queries; PE (px,py) receives rows of block py*P+px"}
  - {name: "K", shape: "[S * d]", dtype: "f32", description: "row-major keys, replicated to every PE"}
  - {name: "V", shape: "[S * d]", dtype: "f32", description: "row-major values, replicated to every PE"}

outputs:
  - {name: "O", shape: "[S * d]", dtype: "f32",
     tolerance_abs: 1.0e-4, tolerance_rel: 1.0e-4,
     description: "O == softmax(Q K^T / sqrt(d)) V against a float64 NumPy oracle; verified in run.py + SUCCESS"}

# Reference provenance: hand-written EXPERT kernel (attention-wse M5: DSD +
# @fmacs/@fmaxs/@fmuls inner loops, scalar exp). Scalar query-parallel version
# of the same layout (attention-wse M2): 458,419 cycles at P=4,S=64,d=32.
# Reference cycles below are measured with rebaseline_references.py (median of 3).
sizes:
  - name: p2
    role: scaling
    params: {P: 2, St_q: 4, S: 16, d: 32}
    commands_script: "commands_wse3_p2.sh"
    wse3_reference: {cycles_send: 21089, time_send_us: 24.811}
  - name: small
    role: correctness
    params: {P: 4, St_q: 4, S: 64, d: 32}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 68764, time_send_us: 80.899}
  - name: p8
    role: scaling
    params: {P: 8, St_q: 2, S: 128, d: 32}
    commands_script: "commands_wse3_p8.sh"
    wse3_reference: {cycles_send: 65962, time_send_us: 77.602}

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "expert-tuned multi-PE attention; the reference already uses wide DSD arithmetic, so beating it requires precision or scheduling changes"

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

precision:
  io_dtype: f32
  accumulate: f32
  allow_f16_internal: false

frozen_functions: ["compute"]

optimization_angles:
  - dsd_width_flatten_l0
  - fmac_bulk
  - dsd_offset_chaining
  - comptime_hoist
  - buffer_cleanup
  - microthread_explicit_wse3
  - async_detach_overlap
  - f16_precision

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — np.testing.assert_allclose(atol=1e-4, rtol=1e-4) + SUCCESS"
hidden_from_optimize_only: ["CSL/pe.csl"]
tags: ["multi_pe", "attention", "softmax", "transformer", "expert_reference", "difficulty_4"]
