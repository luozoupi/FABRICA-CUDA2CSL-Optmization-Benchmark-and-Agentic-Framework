kernel_id: "Dot-Product-1PE"
group: "blas"
difficulty: 1

tasks:
  - "Compute the dot product of two f32 vectors on a single PE:
     result = sum(x[i]*y[i]). Fundamental BLAS-1 inner product.
     entrypoint = compute."

inputs:
  - {name: "x", shape: "[n]", dtype: "f32"}
  - {name: "y", shape: "[n]", dtype: "f32"}

outputs:
  - {name: "result", shape: "[1]", dtype: "f32",
     tolerance_abs: 1.0e-3, tolerance_rel: 1.0e-3,
     description: "result == np.dot(x,y); verified in run.py + SUCCESS"}

sizes:
  - name: small
    role: correctness
    params: {n: 512}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 10254}

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "multiply-accumulate reduction; on-device TSC window"

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — np.testing.assert_allclose + SUCCESS"
hidden_from_optimize_only: ["CSL/pe.csl"]
tags: ["single_pe", "blas", "reduction", "kernelbench_enrichment"]
