# xkernel-bench spec -- see kernels/SPEC_SCHEMA.md for format.
kernel_id: "SpMV-RowBlock"
group: "sparse"
difficulty: 3

tasks:
  - "Sparse matrix-vector product y = A*x, A in CSR, on a 1 x P strip of PEs: the rows are
     split into P consecutive blocks (one per PE, padded to nrows_pe rows and max_nnz_pe
     nonzeros), x is written to PE 0 and broadcast east on one color to every PE, each PE
     computes its block y[r] = sum_j val[j]*x[col_idx[j]] over local rows with global
     column indices. entrypoint = main (device-internal timing)."

inputs:
  - {name: "row_ptr", shape: "[P][nrows_pe+1]", dtype: "u32"}
  - {name: "col_idx", shape: "[P][max_nnz_pe]", dtype: "u32"}
  - {name: "val", shape: "[P][max_nnz_pe]", dtype: "f32"}
  - {name: "x", shape: "[ncols]", dtype: "f32", description: "written to PE 0 only; the kernel broadcasts it"}

outputs:
  - {name: "y", shape: "[P][nrows_pe]", dtype: "f32",
     tolerance_abs: 1.0e-5, tolerance_rel: 1.0e-4,
     description: "y = A*x on the real rows; verified in run.py against float64 numpy + SUCCESS"}

# Each size carries its own matrix class (data/manifest[_<structure_id>].json); the caps
# are the class maxima after the row-block partition (checked by test_sparse_suite.py).
sizes:
  - name: small
    role: correctness
    structure_class: "hb_n1024"              # sherman1 (train); jagmesh1, gr_30_30, dwt_1005
    params: {P: 4, nrows_pe: 256, ncols: 1024, max_nnz_pe: 2560, iters: 1, structure_id: 0}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 37330, time_send_us: 43.9176}   # SDK 2.10 simulator, 2026-09-16
  - name: p1
    role: scaling
    structure_class: "hb_n512"               # 494_bus (train); bcspwr05, gre_512, west0479
    params: {P: 1, nrows_pe: 512, ncols: 512, max_nnz_pe: 2304, iters: 1, structure_id: 1}
    commands_script: "commands_wse3_p1.sh"
    wse3_reference: {cycles_send: 61107, time_send_us: 71.8906}   # SDK 2.10 simulator, 2026-09-16
  - name: p16
    role: scaling
    structure_class: "hb_power_n2048"        # bcspwr07 (train); bcspwr06, bcspwr08, bcspwr09
    params: {P: 16, nrows_pe: 128, ncols: 2048, max_nnz_pe: 1024, iters: 1, structure_id: 2}
    commands_script: "commands_wse3_p16.sh"
    wse3_reference: {cycles_send: 19375, time_send_us: 22.7941}   # SDK 2.10 simulator, 2026-09-16
  - name: p8
    role: scaling
    structure_class: "hb_n1024"              # same matrices as small: strong scaling 4 -> 8 -> 16 PEs
    params: {P: 8, nrows_pe: 128, ncols: 1024, max_nnz_pe: 1536, iters: 1, structure_id: 0}
    commands_script: "commands_wse3_p8.sh"
    wse3_reference: {cycles_send: 21370, time_send_us: 25.1412}   # SDK 2.10 simulator, 2026-09-21, held-out passed
  - name: p64
    role: scaling
    structure_class: "hb_power_n2048"        # same matrices as p16: strong scaling 16 -> 64 -> 256 PEs
    params: {P: 64, nrows_pe: 27, ncols: 2048, max_nnz_pe: 256, iters: 1, structure_id: 2}
    commands_script: "commands_wse3_p64.sh"
    wse3_reference: {cycles_send: 6411, time_send_us: 7.5424}   # SDK 2.10 simulator, 2026-09-30, held-out passed
  - name: p256
    role: scaling
    structure_class: "hb_power_n2048"        # same matrices as p16; 7 rows per PE covers the largest matrix
    params: {P: 256, nrows_pe: 7, ncols: 2048, max_nnz_pe: 64, iters: 1, structure_id: 2}
    commands_script: "commands_wse3_p256.sh"
    wse3_reference: {cycles_send: 3461, time_send_us: 4.0718}   # SDK 2.10 simulator, 2026-09-30, held-out passed
  - name: it10
    role: workload
    structure_class: "hb_n1024"              # same matrices and PEs as small, 10 iterations resident
    params: {P: 4, nrows_pe: 256, ncols: 1024, max_nnz_pe: 2560, iters: 10, structure_id: 0}
    commands_script: "commands_wse3_it10.sh"
    wse3_reference: {cycles_send: 373685, time_send_us: 439.6294}   # SDK 2.10 simulator, 2026-09-21, held-out passed

# Host-side mapping hook (2026-09-30): an optional row_order.py permutes the rows before the
# equal-block split over the PEs (run.py); offered to the optimizer only with XKERNEL_FABRIC_HOOKS=1.
fabric_hooks: [row_order]

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "agent-written row-block CSR SpMV with fabric broadcast of x; device-internal window (max end - min start over the strip)"

timing_protocol: device_internal_v2

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

structure:
  format: csr
  class: "hb_n1024"
  manifest: "CSL/data/manifest.json"
  partition: {scheme: row_block, mesh: "4x1"}
  caps: {nrows_pe: 256, max_nnz_pe: 2560}
  readout: true

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py -- float64 numpy y = A@x on the real rows (rtol=1e-4, atol=1e-5) + SUCCESS"

hidden_from_optimize_only:
  - "CSL/pe.csl"

frozen_functions:
  - "f_tic_dev"
  - "f_toc_dev"
  - "f_enable_timer"
  - "f_memcpy_timestamps"
  - "f_tic"
  - "f_toc"
frozen_params:
  - "P"
  - "nrows_pe"
  - "ncols"
  - "max_nnz_pe"
  - "iters"
  - "structure_id"

# Provenance: CUDA source concretized from GraphBLAS CUDA/mxm/template/GB_cuda_jit_AxB_dot3_phase3_spdn.cuh
# with B := x (mxv); see CUDA/kernel.cu header. Reference authored 2026-09-16 (v2 sparse study, S suite).
optimization_angles:
  - "dsd_offset_chaining"
  - "fmac_bulk"
  - "stride_optimization"
  - "comptime_hoist"
  - "prefetch_fabric_async"

tags:
  - "multi_pe"
  - "sparse"
  - "csr"
  - "gather"
  - "broadcast"
  - "row_block"
