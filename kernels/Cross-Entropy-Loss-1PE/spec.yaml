kernel_id: "Cross-Entropy-Loss-1PE"
group: "loss"
difficulty: 3

tasks:
  - "Compute single-sample cross-entropy loss on a single PE:
     loss = -log(softmax(logits)[label]) using the log-sum-exp trick
     for numerical stability. Combines max-find, exp, log, and indexing.
     entrypoint = compute."

inputs:
  - {name: "logits", shape: "[n_classes]", dtype: "f32"}
  - {name: "label", shape: "[1]", dtype: "u32"}

outputs:
  - {name: "result", shape: "[1]", dtype: "f32",
     tolerance_abs: 1.0e-4, tolerance_rel: 1.0e-3,
     description: "result == -log(softmax(logits)[label]); verified in run.py + SUCCESS"}

sizes:
  - name: small
    role: correctness
    params: {n_classes: 256}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 29283}

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "max-reduce + exp+sum + log + index; multi-transcendental; on-device TSC window"

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — np.testing.assert_allclose + SUCCESS"
hidden_from_optimize_only: ["CSL/pe.csl"]
tags: ["single_pe", "loss", "reduction", "transcendental", "classification", "kernelbench_enrichment"]
