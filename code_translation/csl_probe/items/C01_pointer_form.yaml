  var ptr_x: [*]f32 = &x_array;\nvar ptr_a: [*]f32 = &a_array;\nvar ptr_y: [*]f32 = &y_array[0];\n\nconst y_dsd\
  \ = @get_dsd(mem1d_dsd, .{ .tensor_access = |i|{n} -> y_array[i] });\n\nfn compute() void {\n  const a: f32 =\
  \ a_array[0];\n  var i: u16 = 0;\n  while (i < n) : (i += 1) {\n    y_array[i] = a * x_array[i] + y_array[i];\n\
  \  }\n  @fmuls(y_dsd, y_dsd, 2.0);\n  @activate(DONE);\n}\n\ntask f_done() void {\n  memcpy_mod.unblock_cmd_stream();\n\
  }\n\ncomptime {\n  @bind_local_task(f_done, DONE);\n  @export_symbol(ptr_x, \"x\");\n  @export_symbol(ptr_a, \"\
  a\");\n  @export_symbol(ptr_y, \"y\");\n  @export_symbol(compute);\n}\n"
