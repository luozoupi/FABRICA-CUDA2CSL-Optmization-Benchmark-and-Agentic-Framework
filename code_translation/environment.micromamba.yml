# Agent environment for the xkernel CUDA->CSL framework (translation, repair,
# optimization, benchmark staging, aggregation and figure generation).
#   ~/bin/micromamba create -y -n xkernel-agent -f code_translation/environment.micromamba.yml
# Pins mirror the environment the published sweeps ran in (Python 3.11.15).
# Optional heavy extras (post-training, Ollama) live in environment-extras.yml.
# The Cerebras appliance/hardware client (SDK 2.10) is a separate venv; see SETUP.md.
name: xkernel-agent
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # LLM providers
      - anthropic==0.96.0
      - openai==2.38.0
      - httpx==0.28.1
      - globus-sdk==4.7.0        # ALCF inference endpoints (open-weight models)
      # framework
      - PyYAML==6.0.3
      - numpy==2.4.6
      - python-dotenv==1.2.1
      - psutil==7.1.3
      - filelock==3.20.0
      - requests==2.33.1
      - tqdm==4.67.3
      # analysis, aggregation and figures
      - tiktoken==0.13.0
      - pandas==2.2.3
      - scipy==1.15.3
      - matplotlib==3.11.0
