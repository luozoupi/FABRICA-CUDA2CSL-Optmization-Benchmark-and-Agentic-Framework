kernel_id: "SiLU-1PE"
group: "activation"
difficulty: 2

tasks:
  - "Apply SiLU (Swish) activation elementwise on a single PE:
     out[i] = x[i] * sigmoid(x[i]) = x[i] / (1+exp(-x[i])).
     Modern LLM activation (Llama). entrypoint = compute."

inputs:
  - {name: "x", shape: "[n]", dtype: "f32"}

outputs:
  - {name: "out", shape: "[n]", dtype: "f32",
     tolerance_abs: 1.0e-5, tolerance_rel: 1.0e-4,
     description: "out == x*sigmoid(x); verified in run.py + SUCCESS"}

sizes:
  - name: small
    role: correctness
    params: {n: 512}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 104473}

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "elementwise exp+div+mul; exercises CSL math library; on-device TSC window"

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — np.testing.assert_allclose + SUCCESS"
hidden_from_optimize_only: ["CSL/pe.csl"]
tags: ["single_pe", "activation", "elementwise", "transcendental", "llm", "kernelbench_enrichment"]
