kernel_id: "Prefix-Sum-1PE"
group: "scan"
difficulty: 2

tasks:
  - "Compute inclusive prefix sum (cumulative sum) on a single PE:
     out[i] = sum(x[0..i]). Classic parallel algorithm primitive.
     entrypoint = compute."

inputs:
  - {name: "x", shape: "[n]", dtype: "f32"}

outputs:
  - {name: "out", shape: "[n]", dtype: "f32",
     tolerance_abs: 1.0e-3, tolerance_rel: 1.0e-3,
     description: "out == np.cumsum(x); verified in run.py + SUCCESS"}

sizes:
  - name: small
    role: correctness
    params: {n: 512}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 9229}

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "sequential accumulation with output at each step; on-device TSC window"

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — np.testing.assert_allclose + SUCCESS"
hidden_from_optimize_only: ["CSL/pe.csl"]
tags: ["single_pe", "scan", "prefix_sum", "kernelbench_enrichment"]
