prompt: 'Read this Cerebras CSL fragment (SDK 2.10, one PE) and answer the question. Assume every builtin behaves
  as the SDK documents it. Reply with the answer first (four numbers), then one sentence of justification.


  ```csl

  var a = @zeros([4]f16); var b = @zeros([4]f16); var c = @zeros([4]f16);

  // a = [1,2,3,4], b = [2,2,2,2], c = [1,1,1,1]

  const ad = @get_dsd(mem1d_dsd, .{ .tensor_access = |i|{4} -> a[i] });

  const bd = @get_dsd(mem1d_dsd, .{ .tensor_access = |i|{4} -> b[i] });

  const cd = @get_dsd(mem1d_dsd, .{ .tensor_access = |i|{4} -> c[i] });

  @fmach(cd, cd, ad, bd);

  ```


  Question: What does c contain (c = c + a*b elementwise)? Give the four values in order.'
expected:
