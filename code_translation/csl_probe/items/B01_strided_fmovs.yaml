id: B01_strided_fmovs
group: B_semantics
prompt: 'Read this Cerebras CSL fragment (SDK 2.10, one PE) and answer the question. Assume every builtin behaves
  as the SDK documents it. Reply with the answer first (four numbers), then one sentence of justification.


  ```csl

  var x = @zeros([8]f32); var y = @zeros([4]f32);

  // x = [1,2,3,4,5,6,7,8] after the host copy

  const xs = @get_dsd(mem1d_dsd, .{ .tensor_access = |i|{4} -> x[2*i] });

  const yd = @get_dsd(mem1d_dsd, .{ .tensor_access = |i|{4} -> y[i] });

  @fmovs(yd, xs);

  ```


  Question: What does y contain after the @fmovs? Give the four values in order.'
expected:
  values:
  - 1
  - 3
  - 5
  - 7
scoring: trailing numbers within 1e-3 relative of the key, or the letter for choice items
ground_truth: numpy/documented semantics; simulator confirmation of the numeric items pending (make_ground_truth.sh)
