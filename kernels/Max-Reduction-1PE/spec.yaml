kernel_id: "Max-Reduction-1PE"
group: "reduction"
difficulty: 1

tasks:
  - "Find the maximum of a float32 vector on a single PE:
     result = max(x[0..n-1]). entrypoint = compute."

inputs:
  - {name: "x", shape: "[n]", dtype: "f32"}

outputs:
  - {name: "result", shape: "[1]", dtype: "f32",
     tolerance_abs: 1.0e-7, tolerance_rel: 1.0e-5,
     description: "result == np.max(x); verified in run.py (assert_allclose) + SUCCESS"}

sizes:
  - name: small
    role: correctness
    params: {n: 512}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 8188}

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "comparison-based reduction over f32 array; on-device TSC window"

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — np.testing.assert_allclose + SUCCESS"

hidden_from_optimize_only:
  - "CSL/pe.csl"

tags:
  - "single_pe"
  - "reduction"
  - "max"
  - "kernelbench_enrichment"
