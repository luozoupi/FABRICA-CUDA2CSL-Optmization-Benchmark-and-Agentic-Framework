kernel_id: "RowParallel-Softmax"
group: "collective"
difficulty: 4

tasks:
  - "Distributed numerically-stable softmax across a 4-PE strip.
     Four phases: (1) AllReduce(max) for stability, (2) broadcast global
     max + local exp, (3) AllReduce(sum_exp), (4) broadcast global sum +
     local normalize. Uses 4 fabric colors for reduce+broadcast in each
     direction. entrypoint = compute."

inputs:
  - {name: "x", shape: "[n_per_pe * width]", dtype: "f32"}

outputs:
  - {name: "out", shape: "[n_per_pe * width]", dtype: "f32",
     tolerance_abs: 1.0e-5, tolerance_rel: 1.0e-3,
     description: "out == stable_softmax(x_all); verified in run.py + SUCCESS"}

sizes:
  - name: small
    role: correctness
    params: {n_per_pe: 128, width: 2, height: 1}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 17714}

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "4-phase allreduce+broadcast pipeline; exercises multi-color routing + transcendental compute"

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — np.testing.assert_allclose + SUCCESS"
hidden_from_optimize_only: ["CSL/pe.csl"]
tags: ["multi_pe", "collective", "allreduce", "broadcast", "softmax", "transformer", "difficulty_4"]
