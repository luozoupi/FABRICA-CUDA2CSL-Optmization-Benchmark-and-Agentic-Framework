  const yd = @get_dsd(mem1d_dsd, .{ .tensor_access = |i|{3} -> y[i] });

  const a: f32 = 2.0;

  @fmacs(yd, yd, xd, a);

  ```


  Question: What does y contain? Give the three values in order.'
