kernel_id: "SAXPY-1PE"
group: "blas"
difficulty: 1

tasks:
  - "Compute SAXPY on a single PE: y[i] = alpha * x[i] + y[i] for
     float32 vectors. The classic BLAS-1 operation. entrypoint = compute."

inputs:
  - {name: "x", shape: "[n]", dtype: "f32"}
  - {name: "y", shape: "[n]", dtype: "f32"}
  - {name: "alpha", shape: "[1]", dtype: "f32"}

outputs:
  - {name: "y", shape: "[n]", dtype: "f32",
     tolerance_abs: 1.0e-6, tolerance_rel: 1.0e-5,
     description: "y == a*x + y_orig; verified in run.py (assert_allclose) + SUCCESS"}

sizes:
  - name: small
    role: correctness
    params: {n: 512}
    commands_script: "commands_wse3.sh"
    wse3_reference: {cycles_send: 11276}

task_class: "real-translation"
split: "test"

metric:
  class: cycles
  reason: "elementwise fused multiply-add over f32; on-device TSC window"

eval:
  train_seed: 7
  heldout_seeds: [101, 202, 303]
  seed_env: "XKERNEL_EVAL_SEED"

build_command: "bash commands_wse3.sh"
verify: "embedded in run.py — np.testing.assert_allclose + SUCCESS"

hidden_from_optimize_only:
  - "CSL/pe.csl"

tags:
  - "single_pe"
  - "blas"
  - "elementwise"
  - "fma"
  - "kernelbench_enrichment"
